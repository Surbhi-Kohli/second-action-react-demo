name: Deploy website
on:
  push:
    branches:
      - main
jobs:
  test: # job1
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: deps-node-modules-${{hashFiles('**/package-lock.json')}}
      - name: Install dependencies
        run: npm ci
      # - name: Lint code
      #   run: npm run lint
      - name: Test code
        run: npm run test
  build: # job2
    needs: test
    runs-on: ubuntu-latest
    outputs: 
      script-file: ${{steps.publish.outputs.my-script-file}}
    steps:
      - name: Get code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: deps-node-modules-${{hashFiles('**/package-lock.json')}}
      - name: Install dependencies  
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: |
                dist
                package.json 
      - name: Publish JS files
        id: publish
        run: find dist/assets/*.js -type f -execdir echo 'my-script-file={}' >> $GITHUB_OUTPUT ';'         
  deploy: # job3
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get build Artifacts
        uses: actions/download-artifact@v4 # action to download the artifacts uploaded by previous artifacts upload action
        with:
          name: dist-files # To download the artifacts that were uploaded in the previous build job, we use same name identifier
      - name: Output contents
        run: ls    
      - name: Output filename
        run: echo "${{needs.build.outputs.script-file }}"
      - name: Deploy
        run: echo "Deploying..."

# In build job we run the build script which generates a dist folder , whose contents
# need to be uploaded to some hosting server.Leaving these outputs on the runner 
# machine is of no use to use, because once our workflow completes, the runner machine
# will be shut down and these produced files will be lost
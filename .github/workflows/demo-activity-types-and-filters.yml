name: Events Demo 1
on: 
  pull_request:
      types: # Here you specify the list of activity types for the event
          - opened
          - edited
      branches:
          - main  
          - 'dev-*' # for any branch starting with dev- following by alphanumeric char (thats what * stands for) eg dev-new, dev-ui-feat
          - 'feat/**' # for any branch starting with feat/ following by any char and can have / in between (thats what ** stands for) eg feat/new, feat/new/button
  workflow_dispatch: # Here you can manually trigger the workflow , Here we mentioned no activity filters  
  push:
    branches:
      - main
      - 'dev-*'
      - 'feat/**'
    paths-ignore:
      - '.github/workflows/*'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: echo "${{ toJSON(github.event) }}"
      - name: Get code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Test code
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Deploy project
        run: echo "Deploying..."

# Github actions  supports filters for pull_request, pull_request_target, push, release, workflow_dispatch,etc
# eg for push event, we can add the following filters:
# branches| tags | branches-ignore|tags-ignore